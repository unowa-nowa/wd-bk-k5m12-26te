<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEDDING BOOK | Koji & Miya</title>
<style>
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #14283f; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
  <!-- BGMデータ（ループ再生） -->
  <audio id="bgm" src="BGM-wedding.mp3" loop></audio>
  
  <!-- オープニングページを読み込む（allow="autoplay" を追加） -->
  <iframe id="content" src="opening.html" title="Wedding Book" allow="autoplay"></iframe>

  <!-- 追加：子画面（opening.html）からの指示を受け取ってBGMを鳴らす -->
  <script>
    window.addEventListener('message', function(e) {
      if (e.data === 'playBGM') {
        const audio = document.getElementById('bgm');
        if (audio) {
          audio.play().catch(function(err){
            console.warn("BGM再生エラー:", err);
          });
        }
      }
    });
  </script>
<script src="js/main.js"></script> 
</body>
</html>
