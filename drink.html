<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drink Menu | With Our Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="sparkle"></canvas>
<main class="book">
<div class="frame">
  <header class="head rv"><h1 class="en">Drink Menu</h1><p class="ja">本日のお飲み物</p></header>
  <h2 class="course-t rv">Free-flow Drinks</h2>
  <div class="dish rv"><p class="lb">TOAST</p><p class="nm">乾杯酒</p><p class="sm">スパークリングワイン</p><p class="sm">ノンアルコールスパークリング</p></div>
  <div class="dish rv"><p class="lb">WINE &amp; BEER</p><p class="nm">ワイン・ビール</p><p class="sm">白ワイン ／ 赤ワイン</p><p class="sm">ビール</p><p class="sm">ノンアルコールビール</p></div>
  <div class="dish rv"><p class="lb">SPIRITS &amp; COCKTAILS</p><p class="nm">ウイスキー・カクテル</p><p class="sm">ウイスキー（水割り・ロック）</p><p class="sm">ハイボール</p><p class="sm">ジントニック ／ カシスオレンジ</p></div>
  <div class="dish rv"><p class="lb">SOFT DRINKS</p><p class="nm">ソフトドリンク</p><p class="sm">オレンジジュース</p><p class="sm">アップルジュース</p><p class="sm">ウーロン茶</p><p class="sm">ミネラルウォーター（炭酸あり・なし）</p></div>
  <p class="foot-note rv">お飲み物はスタッフまで お気軽にお申し付けください</p>

</div>
<nav class="pager" id="pager"></nav>
</main>
<script src="js/main.js"></script>
</body>
</html>
