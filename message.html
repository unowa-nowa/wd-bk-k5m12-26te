  <header class="head rv"><h1 class="en">With Our Love</h1><p class="ja">大切な皆さまへ</p></header>
  <div class="msg">
<p class="rv">本日は おいそがしいなか<br>私たちの結婚式にお越しいただき<br>誠にありがとうございます</p><p class="rv">皆さまのあたたかな笑顔に囲まれて<br>今日という日を迎えられましたことを<br>心から幸せに思います</p><p class="rv">これまで出会い 支えてくださった皆さまへ<br>感謝をお伝えしたくて<br>今日の一日を 二人で準備してまいりました</p><p class="rv">まだまだ未熟な二人ですが<br>互いを思いやり<br>笑顔の絶えない家庭を築いてまいります<br>これからも どうぞよろしくお願いいたします</p>
  </div>
  <div class="orn rv"><i></i></div>
  <div class="sign rv"><p class="d">2035年11月22日</p><p class="n">藤原 幸士 <span>&amp;</span> 篠崎 美耶</p></div>
<p class="closing rv">Thank you for being part of our story.</p>
